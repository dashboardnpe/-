<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard NPE | Vale</title>
<script>try{var t=localStorage.getItem('painel-npe-tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="theme-color" content="#00776b">
<meta name="description" content="Dashboard de acompanhamento NPE Vale">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard NPE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: faixa verde com filtros, abas de página, grade de cartões brancos sobre fundo cinza claro (mesma lógica do relatório Power BI) */
:root{--bg:#e6f4e3;--card:#ffffff;--ink:#1d2b2f;--muted:#5b6c71;--line:#d5dcdd;--head:#00776b;--head-ink:#ffffff;
--teal:#00776b;--teal2:#3fb3a6;--amber:#e9a912;--navy:#1d2a5d;--blue:#2c7bb8;--green:#2e9a5a;--grey:#8d9a9f;--lgrey:#c9d1d3;--red:#c9382e;--track:#e6ebec;--shadow:0 1px 2px rgba(10,40,40,.08);
--font:'Barlow',system-ui,sans-serif;--disp:'Barlow Condensed','Barlow',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101719;--card:#192326;--ink:#e5eeef;--muted:#9fb0b5;--line:#2b383c;--head:#0a5a52;--teal:#33b5a6;--teal2:#6fd0c4;--amber:#f0b83a;--navy:#7f93e0;--blue:#58a6dc;--green:#4cc17f;--grey:#8d9a9f;--lgrey:#4b5a5f;--red:#ec6a5f;--track:#26343a;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101719;--card:#192326;--ink:#e5eeef;--muted:#9fb0b5;--line:#2b383c;--head:#0a5a52;--teal:#33b5a6;--teal2:#6fd0c4;--amber:#f0b83a;--navy:#7f93e0;--blue:#58a6dc;--green:#4cc17f;--grey:#8d9a9f;--lgrey:#4b5a5f;--red:#ec6a5f;--track:#26343a;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;margin:0}
.wrap{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
header{background:var(--head);color:var(--head-ink)}
.top{display:flex;gap:16px 24px;align-items:center;flex-wrap:wrap;padding-block:12px}
.brand-actions{display:flex;flex-direction:column;align-items:flex-start;gap:9px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:14px;line-height:1}
.brand img{display:block;height:38px;width:auto;max-width:180px;object-fit:contain}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.theme-toggle{width:42px;height:38px;display:flex;align-items:center;justify-content:center;font-size:20px;padding:0;flex:0 0 42px}
@media(max-width:760px){.filters{margin-left:0;order:3;width:100%}.theme-toggle{margin-left:auto}}
.dd{position:relative;min-width:150px}
.dd.off{opacity:.45}
.dd>label{display:block;font-size:11px;font-weight:600;margin-bottom:2px;letter-spacing:.02em}
.dd>button{width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font:inherit;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.dd>button::after{content:"▾";color:var(--muted)}
.dd .pn{position:absolute;z-index:30;top:100%;left:0;min-width:100%;max-height:300px;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.2);padding:4px;margin-top:2px}
.dd .pn[hidden]{display:none}
.pn label{display:flex;gap:8px;align-items:center;padding:4px 6px;white-space:nowrap;cursor:pointer;border-radius:3px}
.pn label:hover{background:var(--track)}
.pn .mh{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:3px}
.pn .mh:hover{background:var(--track)}
.pn .mt{flex:1;display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font:inherit;font-weight:600;text-align:left;cursor:pointer;padding:0;white-space:nowrap}
.pn .mt .car{display:inline-block;width:10px;font-size:9px;color:var(--muted);transition:transform .15s}
.pn .mt[aria-expanded="true"] .car{transform:rotate(90deg)}
.pn .mt .cnt{margin-left:auto;padding-left:10px;font-size:11px;font-weight:500;color:var(--teal)}
.pn .md{padding-left:22px}
.pn .md[hidden]{display:none}
.pn .gh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 6px 2px}
.pn .clr{width:100%;border:0;background:none;color:var(--teal);font:inherit;text-align:left;padding:4px 6px;cursor:pointer;font-weight:600}
.btn{background:transparent;color:var(--head-ink);border:1px solid rgba(255,255,255,.55);border-radius:4px;padding:6px 12px;font:inherit;cursor:pointer;font-weight:500}
.btn:hover{background:rgba(255,255,255,.14)}
nav.tabs{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs a{padding:11px 18px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500;border-bottom:3px solid transparent}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
/* Menu de ações (seta para cima) no canto direito da barra de páginas */
.tabbar{position:relative;display:flex;align-items:stretch;background:var(--card);border-bottom:1px solid var(--line)}
.tabbar nav.tabs{flex:1 1 auto;min-width:0;background:transparent;border-bottom:0}
.menu{flex:0 0 auto;display:flex;align-items:center;padding-inline:8px max(16px,env(safe-area-inset-right,0px))}
.menu-toggle{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.menu-toggle:hover,.menu-toggle[aria-expanded="true"]{color:var(--ink);background:var(--track)}
.menu-toggle svg{width:18px;height:18px;display:block}
.menu-panel{position:absolute;z-index:40;top:100%;right:max(16px,env(safe-area-inset-right,0px));margin-top:2px;min-width:200px;display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.menu-panel[hidden]{display:none}
.menu-panel .btn{width:100%;text-align:left;color:var(--ink);border-color:var(--line)}
.menu-panel .btn:hover{background:var(--track)}
main{padding-block:14px 24px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.card{background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.c3{grid-column:span 3}
.c4{grid-column:span 4}
.c5{grid-column:span 5}
.c6{grid-column:span 6}
.c7{grid-column:span 7}
.c8{grid-column:span 8}
.c9{grid-column:span 9}
.c12{grid-column:span 12}

@media(max-width:980px){
 .c3,.c4,.c5,.c6,.c7,.c8,.c9{
  grid-column:span 12
 }
}

.kpis{display:flex;gap:12px 24px;flex-wrap:wrap}

/* Layout especial - Indicador de Impactos */
.impacto-layout{
 display:grid;
 grid-template-columns:minmax(0,1fr) 145px;
 gap:12px;
 align-items:center;
 min-width:0;
}

.impacto-rosca{
 min-width:0;
}

.impacto-popup{
 background:var(--bg);
 border:1px solid var(--line);
 border-radius:8px;
 padding:16px 12px;
 box-shadow:0 3px 10px rgba(0,0,0,.10);
 text-align:center;
 position:relative;
}

.impacto-popup::before{
 content:"";
 display:block;
 width:28px;
 height:3px;
 background:var(--teal);
 border-radius:5px;
 margin:0 auto 12px;
}

.impacto-popup .valor{
 display:block;
 font-family:var(--disp);
 font-size:36px;
 font-weight:600;
 line-height:1.1;
 color:var(--teal);
 font-variant-numeric:tabular-nums;
}

.impacto-popup .titulo{
 display:block;
 font-size:11px;
 color:var(--muted);
 text-transform:uppercase;
 letter-spacing:.06em;
 font-weight:600;
 margin-bottom:8px;
}

.impacto-popup .unidade{
 display:block;
 font-size:11px;
 color:var(--muted);
 margin-top:5px;
}

@media(max-width:600px){
 .impacto-layout{
  grid-template-columns:1fr;
 }
 .impacto-popup{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:12px;
 }
 .impacto-popup::before{
  display:none;
 }
 .impacto-popup .titulo{
  margin:0;
 }
 .impacto-popup .valor{
  font-size:30px;
 }
/* Impactos - compactação */
.card.imp-compact{
 padding:10px 12px;
}

.card.imp-compact h3{
 margin-bottom:6px;
 font-size:13px;
}

.imp-table{
 max-height:190px;
 overflow:auto;
}

.imp-table th,
.imp-table td{
 padding:4px 7px;
 font-size:11px;
}


/* Dashboard de impactos */
.impacto-layout{
 display:grid;
 grid-template-columns:minmax(0,1fr) 125px;
 align-items:center;
 gap:5px;
 min-width:0;
}

.impacto-rosca{
 min-width:0;
}

.impacto-popup{
 background:var(--bg);
 border:1px solid var(--line);
 border-radius:7px;
 padding:12px 5px;
 text-align:center;
}

.impacto-popup .titulo{
 display:block;
 font-size:9px;
 color:var(--muted);
 font-weight:600;
 margin-bottom:6px;
}

.impacto-popup .valor{
 display:block;
 font-size:27px;
 font-family:var(--disp);
 color:var(--teal);
 font-weight:600;
 white-space:nowrap;
}

.impacto-popup .unidade{
 display:block;
 font-size:10px;
 color:var(--muted);
 margin-top:5px;
}

.imp-table{
 max-height:260px;
 overflow:auto;
}

.imp-table table{
 width:100%;
}

.imp-table th,
.imp-table td{
 padding:5px 7px;
 font-size:11px;
}

@media(max-width:720px){
 .impacto-layout{
  grid-template-columns:minmax(0,1fr) 110px;
 }
}


}

.kpi{flex:1;min-width:110px}
.kpi b{display:block;font-family:var(--disp);font-size:34px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi b.neg{color:var(--red)}
.kpi span{font-size:12px;color:var(--muted)}
.chart{width:100%}
.tw{overflow:auto;max-height:340px;border-radius:4px}
.tw.tall{max-height:560px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--teal);color:#fff;text-align:left;padding:7px 10px;position:sticky;top:0;z-index:2;white-space:nowrap;font-weight:600}
.dark-th th{color:#fff}
td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:200px}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);position:sticky;bottom:0;background:var(--card)}
tr.grp{cursor:pointer}
tr.grp td:first-child::before{content:"⊞ ";color:var(--muted)}
tr.grp.open td:first-child::before{content:"⊟ "}
tr.sub td{color:var(--muted);background:var(--bg)}
tr.sub td:first-child{padding-left:30px}
tr.fam td{font-weight:700;background:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.pill i{width:10px;height:10px;border-radius:50%;display:inline-block}
.bar2{display:flex;flex-direction:column;gap:10px;padding:8px 0}
.bar2 .r{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px}
.bar2 .b{height:38px;background:var(--teal);color:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:600;min-width:60px}
.pct{text-align:center;color:var(--muted);font-size:13px;margin:2px 0}
.prog .lbl{display:block;text-align:center;border-radius:20px;color:#fff;padding:2px 10px;font-weight:600;font-size:13px;margin-bottom:8px}
.prog .big{display:block;text-align:center;font-family:var(--disp);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums}
.prog .trk{height:10px;background:var(--track);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.prog .trk i{display:block;height:100%}
.prog .tg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sub4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dayrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font:inherit}
.st{font-weight:600}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
footer{padding:0 max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
footer button{background:none;border:0;color:var(--teal);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:50;max-width:90%}
#toast[hidden]{display:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ===== Modo "tela cheia": em telas largas cada página cabe na janela, sem rolar a página ===== */
@media (min-width:981px) and (min-height:600px){
 html,body{height:100%}
 body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
 header,.tabbar,footer{flex:0 0 auto}
 .top{padding-block:8px}
 .brand img{height:34px}
 main{flex:1 1 auto;min-height:0;padding-block:10px 6px;gap:10px;grid-auto-rows:minmax(0,auto)}
 footer{padding-bottom:6px}
 main[data-p="visao-geral"]{grid-template-rows:auto minmax(0,1fr) minmax(0,1.3fr)}
 main[data-p="report-diario"]{grid-template-rows:auto minmax(0,1.2fr) minmax(0,1.5fr) minmax(0,.9fr)}
 main[data-p="wrench-time"]{grid-template-rows:repeat(2,minmax(0,1fr))}
 main[data-p="impactos"]{grid-template-rows:repeat(2,minmax(0,1fr))}
 main[data-p="controle-de-tintas"]{grid-template-rows:auto minmax(0,.75fr) minmax(0,1.25fr)}
 main[data-p="carteira"]{grid-template-rows:minmax(0,1fr)}
 .card{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:10px 14px}
 .card h3{flex:0 0 auto;margin-bottom:6px;font-size:14px}
 .card>.chart{height:auto!important;flex:1 1 0;min-height:0}
 .card>.tw{flex:1 1 0;min-height:0;max-height:none!important}
 .tw td{padding:var(--tp,4px) 10px;font-size:var(--fs,12px)}
 .tw th{padding:calc(var(--tp,4px) + 1px) 10px;font-size:var(--fs,12px)}
 .kpi b{font-size:28px}
 .kpis{gap:8px 20px}
 .card>.impacto-layout{flex:1 1 0;min-height:0;align-items:stretch}
 .impacto-rosca{display:flex;flex-direction:column;min-height:0}
 .impacto-rosca>.chart{height:auto!important;flex:1 1 0;min-height:0}
 .impacto-popup{align-self:center}
 .bar2{flex:1 1 0;min-height:0;justify-content:center;gap:8px;padding:4px 0}
 .bar2 .b{height:30px}
 .sub4{min-height:0;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px}
 .prog{display:flex;flex-direction:column;justify-content:center;min-height:0;padding:8px 12px}
 .prog .lbl{margin-bottom:4px;font-size:12px}
 .prog .big{font-size:24px}
 .prog .trk{margin:5px 0 3px}
 .pct{margin:0}
 .card>.kpis+.kpis{margin-top:4px!important}
 .card>.kpis .kpi span{font-size:11px}
}

.chart.clk{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px;padding-bottom:2px;flex:0 0 auto}
.chips[hidden]{display:none}
.chips .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chips button{font:inherit;font-size:12px;cursor:pointer;border-radius:999px;padding:3px 10px;border:1px solid var(--teal);background:var(--card);color:var(--ink)}
.chips button.chip::after{content:" ×";color:var(--muted)}
.chips button.clr2{border-color:var(--line);color:var(--muted)}
/* O tema claro/escuro é controlado pelo botão do cabeçalho */
:root[data-theme="light"]{color-scheme:light}
body{background:var(--bg)}
</style>
</head>
<body>
<header><div class="wrap top">
<div class="brand-actions">
 <div class="brand"><img src="imagens/npelogob.png" alt="NPE"><img src="imagens/valelogob.png" alt="Vale"></div>
</div>
<input type="file" id="file" accept=".xlsx,.xlsm" hidden>
<div class="filters" id="filters"></div>
<button class="btn theme-toggle" id="bgToggle" type="button" aria-label="Alternar tema" title="Alternar tema">☀</button>
</div></header>
<div class="tabbar">
<nav class="tabs wrap" id="tabs"></nav>
<div class="menu">
 <button class="menu-toggle" id="menuBtn" type="button" aria-label="Atualizar e exportar dados" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel" title="Atualizar / exportar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg>
 </button>
 <div class="menu-panel" id="menuPanel" hidden>
  <button class="btn" id="up" type="button">Atualizar planilha</button>
  <button class="btn" id="exp" type="button" hidden>Exportar dados.json</button>
 </div>
</div>
</div>
<div class="wrap chips" id="chips" hidden></div>
<main class="wrap" id="main"></main>
<footer><span id="foot"></span><span><button id="reset" hidden>Voltar aos dados publicados</button></span></footer>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const EMBED=/*DATA*/null;
const WRAP_MEIA_NOITE=true; // soma 24h quando a hora fim é menor que a hora início (ex.: 23h → 01h = 2h, nunca negativo)
const META_PESSOA=5.2,EFETIVO_HIST=9; // medidas [Meta m² Pessoa] e [Efetivo Histograma] do Power BI
function hDia(d){const w=new Date(d+'T00:00:00Z').getUTCDay();return w>=1&&w<=4?9:w===5?8:0} // RPT_HHT Disponível: seg-qui 9h, sex 8h, fim de semana 0
function mm(d){const y=+d.slice(0,4),m=+d.slice(5,7);if(+d.slice(8,10)>=21){const t=new Date(Date.UTC(y,m,1));return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')}return d.slice(0,7)} // Mes_Medicao_Num: dia 21 em diante conta no mês seguinte
const $=s=>document.querySelector(s);
const nf=(v,d=2)=>v==null||isNaN(v)?'–':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fd=s=>s?s.split('-').reverse().join('/'):'';
// Horas: horário real (ex.: 3h30) e, entre parênteses, o decimal (ex.: 3,50)
const hm=v=>{if(v==null||isNaN(v))return '–';const t=Math.round(Math.abs(v)*60);return (v<0?'-':'')+Math.floor(t/60)+'h'+String(t%60).padStart(2,'0')};
const nh=v=>v==null||isNaN(v)?'–':`${hm(v)} (${nf(v)})`;
const isH=u=>u==='HHT'||u==='h';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const uniq=a=>[...new Set(a)];
function num(v){const n=typeof v==='number'?v:parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n}
function iso(v){if(v==null||v==='')return null;
 if(typeof v==='number'){return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10)}
 if(v instanceof Date)return v.toISOString().slice(0,10);

 const mk=(label,ns)=>({label,ns,kits:kitsF(ns),lit:kitsF(ns)*litKit(ns),m2:m2(ns),dias:aut(ns),st:stat(ns)});
 const byStat=(a,b)=>a.st<b.st?-1:a.st>b.st?1:0;
 const fams=uniq(M.sist.map(s=>s.fam)).map(f=>({...mk(f,M.sist.filter(s=>s.fam===f).map(s=>s.nome)),cores:uniq(M.sist.filter(s=>s.fam===f).map(s=>s.cor)).map(c=>mk(c,M.sist.filter(s=>s.fam===f&&s.cor===c).map(s=>s.nome))).sort(byStat)})).sort(byStat);
 const tr=(x,cls,pad)=>`<tr class="${cls}"><td${pad?' style="padding-left:26px"':''}>${esc(x.label)}</td><td class="n">${nf(x.kits,0)}</td><td class="n">${nf(x.lit)}</td><td class="n">${nf(x.m2)}</td><td class="n">${nf(x.dias,0)}</td><td>${x.st}</td></tr>`;
 let tb='';fams.forEach(f=>{tb+=tr(f,'fam');f.cores.forEach(c=>tb+=tr(c,'',1))});
 tb+=tr(mk('Total',M.sist.map(s=>s.nome)),'tot');
 h+=card('c12','Estoque por família e cor',`<div class="tw tall"><table><thead><tr><th>Família / Cor</th><th class="n">Kits Disponíveis</th><th class="n">Litros Disponíveis</th><th class="n">Autonomia m²</th><th class="n">Autonomia Dias</th><th>Status Estoque</th></tr></thead><tbody>${tb}</tbody></table></div><div class="note">Mesmas medidas do relatório: kits pelo menor componente (A/B) em cada corredor; nas linhas de família e no total, o relatório calcula o conjunto dos sistemas, e não a soma deles.</div>`);
 return h}

/* ---------- Carteira ---------- */
function pgCart(){
 const R=M.cart.filter(r=>r.status!=null&&String(r.status).toUpperCase()!=='CANCELADA'&&pass(r,{geo:1,ativo:1,plano:1}));
 if(!R.length)return card('c12','',empty);
 const real={};M.exec.filter(r=>r.etapa==='Acabamento'&&pass(r,{per:1})).forEach(r=>real[r.nota]=(real[r.nota]||0)+r.area); // [Area Acabamento] = Área Realizada
 const rows=R.map(r=>({...r,real:real[r.nota]??null})).sort((a,b)=>((a.prev==null)-(b.prev==null))||((b.prev||0)-(a.prev||0)));
 const cols=[['Nota','nota'],['Site','site'],['Local','local'],['Ativo','ativo'],['Plano Diretor','plano'],['Prioridade','prio'],['Vencimento SAP','venc','d'],['Área Prevista','prev','n'],['Área Delineada','del','n'],['Área Realizada','real','n'],['Status','status']];
 const cell=(r,c)=>{const v=r[c[1]];if(c[2]==='n')return `<td class="n">${v==null?'':nf(v)}</td>`;if(c[2]==='d')return `<td>${fd(v)}</td>`;return `<td>${esc(v==='(Em branco)'?'':v)}</td>`};
 const ts=k=>nf(sum(rows,r=>r[k]));
 return card('c12','Carteira',`<div class="tw tall" style="max-height:640px"><table><thead><tr>${cols.map(c=>`<th class="${c[2]==='n'?'n':''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>cell(r,c)).join('')}</tr>`).join('')}<tr class="tot"><td>Total</td><td></td><td></td><td></td><td></td><td></td><td></td><td class="n">${ts('prev')}</td><td class="n">${ts('del')}</td><td class="n">${ts('real')}</td><td></td></tr></tbody></table></div>`)}

/* ---------- app ---------- */
/* Em telas largas, reduz fonte/espaçamento das tabelas até caberem no cartão (sem rolagem); se ainda assim não couber, a rolagem fica só dentro do cartão */
const FIT_Q='(min-width:981px) and (min-height:600px)';
function fitTables(){
 if(!matchMedia(FIT_Q).matches)return;
 document.querySelectorAll('#main .tw').forEach(w=>{
  let fs=12,tp=4;
  const set=()=>{w.style.setProperty('--fs',fs+'px');w.style.setProperty('--tp',tp+'px')};
  set();
  while(w.scrollHeight>w.clientHeight+1&&(fs>9||tp>1)){if(fs>9)fs-=.5;if(tp>1)tp-=.5;set()}
 })
}
const CHIPS=[['sem','Semana '],['imp','Impacto: '],['grp','Grupo de impacto: '],['desc','Atividade: '],['wgrp','Grupo: '],['per','']];
function chipTxt(k,v){if(k==='per')return v[0]==='M'?'Mês '+v.slice(7)+'/'+v.slice(2,6):'Dia '+fd(v.slice(2));return v}
function renderChips(){
 const el=$('#chips');let h='';
 if(page.f)CHIPS.forEach(([k,l])=>F[k].forEach(v=>{h+=`<button type="button" class="chip" data-ck="${k}" data-cv="${esc(v)}" title="Remover este filtro">${esc(l+chipTxt(k,v))}</button>`}));
 el.hidden=!h;el.innerHTML=h?'<span class="lbl">Filtros por clique:</span>'+h+'<button type="button" class="clr2" data-call="1">Limpar</button>':''}
$('#chips').addEventListener('click',e=>{
 if(e.target.closest('[data-call]')){CHIPS.forEach(([k])=>F[k].clear());draw();return}
 const b=e.target.closest('[data-ck]');if(!b)return;F[b.dataset.ck].delete(b.dataset.cv);draw()});
function draw(){
 charts.forEach(c=>c.dispose());charts=[];post=[];cid=0;readC();
 $('#tabs').innerHTML=PAGES.map(p=>`<a href="#${p.id}" class="${p===page?'on':''}">${p.name}</a>`).join('');
 renderFilters();renderChips();$('#main').dataset.p=page.id;$('#main').innerHTML=page.fn();post.forEach(f=>f());fitTables();
 $('#foot').textContent=`Dados até ${fd(M.last)} · `+`Developer by Pedro Santos`;
}
$('#main').addEventListener('click',e=>{const g=e.target.closest('tr.grp');if(!g)return;g.classList.toggle('open');const k=g.dataset.g;[...g.parentNode.querySelectorAll('tr.sub')].filter(r=>r.dataset.c===k).forEach(r=>r.hidden=!r.hidden)});
$('#main').addEventListener('change',e=>{if(e.target.id==='dsel'){DAY=e.target.value;draw()}});
function route(){const id=location.hash.slice(1);page=PAGES.find(p=>p.id===id)||PAGES[0];draw()}
addEventListener('hashchange',route);
addEventListener('resize',()=>{charts.forEach(c=>c.resize());fitTables()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{charts.forEach(c=>c.resize());fitTables()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>draw());
new MutationObserver(()=>draw()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,5000)}
let CUR=null,SRC='';
function load(S,src){CUR=S;SRC=src;M=build(S);F=newF();$('#reset').hidden=src!=='preview';$('#exp').hidden=false;route()}
// Protege as ações de atualização e exportação com senha.
// Observação: em um HTML estático, esta proteção é apenas de interface.
const SENHA_EDICAO='0000';
function autorizarEdicao(){
 const senha=prompt('Digite a senha para editar o painel:');
 if(senha!==SENHA_EDICAO){toast('Senha incorreta. Ação não autorizada.');return false}
 return true;
}
$('#up').onclick=()=>{if(autorizarEdicao())$('#file').click()};
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const miss=NEED.filter(n=>!wb.SheetNames.includes(n));
  if(miss.length){toast('Planilha não carregada. Faltam as abas: '+miss.join(', '));return}
  const S={};NEED.forEach(n=>{S[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}).filter(r=>r.some(c=>c!=null))});
  load(S,'preview');toast('Planilha '+f.name+' carregada só neste navegador. Para publicar, clique em Exportar dados.json.')}
 catch(err){toast('Não foi possível ler o arquivo: '+err.message)}e.target.value=''};
$('#exp').onclick=()=>{if(!autorizarEdicao())return;try{const b=new Blob([JSON.stringify(CUR)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dados.json';document.body.appendChild(a);a.click();a.remove();toast('dados.json gerado. Suba esse arquivo no GitHub para atualizar o site.')}catch(err){toast('Não foi possível gerar o arquivo: '+err.message)}};
// Alterna entre o tema verde claro e o modo escuro.
const bgToggle=$('#bgToggle');
function setTheme(mode){
 document.documentElement.dataset.theme=mode;
 
 bgToggle.textContent=mode==='dark'?'☾':'☀';
 bgToggle.setAttribute('aria-label',mode==='dark'?'Ativar tema claro':'Ativar tema escuro');
 bgToggle.title=mode==='dark'?'Ativar tema claro':'Ativar tema escuro';

}
let temaSalvo=null;try{temaSalvo=localStorage.getItem('painel-npe-tema')}catch(e){}
setTheme(temaSalvo==='dark'?'dark':'light');
bgToggle.addEventListener('click',()=>{
 const novo=document.documentElement.dataset.theme==='light'?'dark':'light';
 setTheme(novo);
 try{localStorage.setItem('painel-npe-tema',novo)}catch(e){} // lembra a escolha do usuário
});

// Menu da seta: abre/fecha o painel com Atualizar planilha e Exportar dados.json
const menuBtn=$('#menuBtn'),menuPanel=$('#menuPanel');
function setMenu(o){menuPanel.hidden=!o;menuBtn.setAttribute('aria-expanded',String(o))}
menuBtn.addEventListener('click',e=>{e.stopPropagation();setMenu(menuPanel.hidden)});
menuPanel.addEventListener('click',()=>setMenu(false));
document.addEventListener('click',e=>{if(!menuPanel.hidden&&!menuPanel.contains(e.target))setMenu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});

async function init(){
 let S=null,src='';
 try{const r=await fetch('dados.json',{cache:'no-cache'});if(r.ok){S=await r.json();src='dados.json'}}catch(_){}
 if(!S&&EMBED){S=EMBED;src='embutido'}
 if(!S){$('#main').innerHTML=card('c12','','<div class="empty">Nenhum dado encontrado. Coloque o arquivo dados.json ao lado do index.html ou clique em Atualizar planilha.</div>');return}
 load(S,src)}
$('#reset').onclick=init;
init();
// PWA: registra o service worker (funciona em HTTPS ou localhost)
if('serviceWorker' in navigator){
 addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW não registrado:',err)));
}
</script>
